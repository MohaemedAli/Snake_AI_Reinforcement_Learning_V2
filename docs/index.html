<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake AI – Reinforcement Learning Demo</title>
<style>
:root{--bg:#121820;--card:#1b2430;--fg:#eef2f6;--mut:#8b97a7;--acc:#46a0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
h1{font-size:1.2rem;margin:4px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
button{background:var(--card);color:var(--fg);border:1px solid #2c3a4b;border-radius:8px;padding:8px 14px;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#04111f}
canvas{width:min(92vw,500px);height:auto;aspect-ratio:1;border-radius:10px;touch-action:none}
.stats{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;color:var(--mut)}
.stats b{color:var(--fg)}
p{color:var(--mut);max-width:500px;text-align:center;margin:0}
</style>
</head>
<body>
<h1>Snake AI — Double Dueling DQN</h1>
<div class="bar">
  <button id="ai" class="on">Watch AI</button>
  <button id="me">Play yourself</button>
  <button id="pause">Pause</button>
  <button id="restart">Restart</button>
  <label>Speed <input id="speed" type="range" min="2" max="60" value="16"></label>
</div>
<div class="stats">
  <span>Score <b id="sc">0</b></span><span>Best <b id="bs">0</b></span><span>Length <b id="ln">3</b></span><span id="q"></span>
</div>
<canvas id="cv" width="500" height="500"></canvas>
<p>Arrows / WASD or swipe to steer in “Play yourself”. The agent runs entirely in your browser.</p>

<script src="weights.js"></script>
<script src="snake-core.js"></script>
<script>
const { Game, qvalues, W, H } = SnakeCore;
const $ = (id) => document.getElementById(id);
const cv = $('cv'), cx = cv.getContext('2d'), CELL = cv.width / W;
const KEYS = { ArrowRight: 0, d: 0, ArrowDown: 1, s: 1, ArrowLeft: 2, a: 2, ArrowUp: 3, w: 3 };
let mode = 'ai', game, started, paused = false, best = 0, queue = [], acc = 0, last = 0;
try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}

// absolute direction -> relative action (0 straight, 1 right, 2 left, null = U-turn)
const rel = (d, ref) => [0, 1, null, 2][(d - ref + 4) % 4];

function reset() { game = new Game(undefined, mode === 'ai'); queue = []; started = mode === 'ai'; acc = 0; }

function steer(d) {
  if (mode !== 'me' || game.over || paused) return;
  const ref = queue.length ? queue[queue.length - 1] : game.dir;
  if (d === ref) started = true;
  else if (rel(d, ref) !== null && queue.length < 2) { queue.push(d); started = true; }
}

function stepOnce() {
  let a = 0;
  if (mode === 'ai') {
    const q = qvalues(window.SNAKE_WEIGHTS, game.features());
    a = q.indexOf(Math.max(...q));
    $('q').textContent = `Q  straight ${q[0].toFixed(1)} · right ${q[1].toFixed(1)} · left ${q[2].toFixed(1)}`;
  } else if (queue.length) {
    a = rel(queue.shift(), game.dir) ?? 0;
  }
  game.step(a);
  if (game.score > best) { best = game.score; try { localStorage.setItem('snake-best', best); } catch (e) {} }
  if (game.over && mode === 'ai') setTimeout(() => { if (game.over) reset(); }, 1200);
}

function draw() {
  for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) {
    cx.fillStyle = (x + y) % 2 ? '#161e29' : '#1e2733';
    cx.fillRect(x * CELL, y * CELL, CELL, CELL);
  }
  if (game.food) {
    cx.fillStyle = '#eb4b4b'; cx.beginPath();
    cx.arc((game.food[0] + .5) * CELL, (game.food[1] + .5) * CELL, CELL * .38, 0, 7); cx.fill();
  }
  game.snake.forEach(([x, y], i) => {
    cx.fillStyle = i ? `hsl(150 55% ${42 - Math.min(i, 40) * .3}%)` : '#50e691';
    cx.beginPath(); cx.roundRect(x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4, 6); cx.fill();
  });
  $('sc').textContent = game.score; $('bs').textContent = best; $('ln').textContent = game.snake.length;
  const msg = game.over ? (game.won ? 'YOU WIN!' : 'GAME OVER') : paused ? 'PAUSED' : !started ? 'Press an arrow key to start' : '';
  if (msg) {
    cx.fillStyle = 'rgba(0,0,0,.55)'; cx.fillRect(0, 0, cv.width, cv.height);
    cx.fillStyle = '#eef2f6'; cx.font = '600 28px system-ui'; cx.textAlign = 'center';
    cx.fillText(msg, cv.width / 2, cv.height / 2);
  }
}

function tick(t) {
  requestAnimationFrame(tick);
  const dt = Math.min((t - last) / 1000, .25); last = t;
  if (!paused && !game.over && started) {
    acc += dt;
    const per = 1 / +$('speed').value;
    while (acc >= per && !game.over) { acc -= per; stepOnce(); }
  }
  draw();
}

function setMode(m) { mode = m; $('ai').classList.toggle('on', m === 'ai'); $('me').classList.toggle('on', m === 'me'); if (m === 'me') $('q').textContent = ''; reset(); }
$('ai').onclick = () => setMode('ai');
$('me').onclick = () => setMode('me');
$('pause').onclick = () => { paused = !paused; };
$('restart').onclick = reset;
addEventListener('keydown', (e) => {
  if (e.key === 'p') { paused = !paused; return; }
  if (e.key in KEYS) { e.preventDefault(); steer(KEYS[e.key]); }
});
let t0;
cv.addEventListener('touchstart', (e) => { t0 = e.touches[0]; }, { passive: true });
cv.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3));
});

reset();
requestAnimationFrame(tick);
</script>
</body>
</html>
